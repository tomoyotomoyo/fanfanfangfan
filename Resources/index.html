<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>DFM Injector</title>
<style>
:root {
  --bg: #050505;
  --fg: #e8e8e8;
  --fg-dim: #6a6a6a;
  --fg-accent: #c8c8c8;
  --fg-error: #c66;
  --signal: #bbff00;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Consolas, "Liberation Mono", Menlo, "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  min-height: 100vh; min-height: 100dvh;
  overflow-x: hidden;
}
body { position: relative; }
#bg-wrap {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none; isolation: isolate;
}
#signal-pulse {
  position: absolute; left: 0; right: 0; top: 55vh; height: 3px;
  background: var(--signal); mix-blend-mode: multiply;
  pointer-events: none; opacity: 0; will-change: opacity;
}
#signal-pulse.flash { animation: signalFlash 90ms ease-out; }
@keyframes signalFlash { 0%{opacity:0} 40%{opacity:1} 100%{opacity:0} }
#terminal {
  position: fixed; inset: 0; z-index: 2;
  display: flex; flex-direction: column; justify-content: flex-end;
  align-items: center; pointer-events: none;
  padding: 2rem 2rem 5vh; overflow: hidden;
}
#terminal-lines {
  font-family: var(--mono); font-size: 14px; line-height: 1.7;
  max-width: min(90vw, 560px); white-space: pre-wrap; word-break: break-all;
  text-align: left; color: var(--fg-accent); pointer-events: none;
}
.line { min-height: 1.5em; }
.line.error { color: var(--fg-error); }
.line.dim { color: var(--fg-dim); }
.line.ok { color: var(--signal); }
@keyframes blink { 0%,49%{opacity:0.65} 50%,100%{opacity:0} }
.cursor-underline {
  display: inline-block; width: 0.55em;
  border-bottom: 2px solid var(--fg); vertical-align: text-bottom;
  animation: blink 1.1s steps(1) infinite; margin-left: 2px;
}
.accent { color: var(--signal); }
#action-btn {
  position: fixed; top: 90%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 5; display: none;
  pointer-events: auto;
  background: transparent; border: 1px solid var(--signal);
  color: var(--signal); font-family: var(--mono); font-size: 14px;
  padding: 12px 24px; cursor: pointer;
  text-align: center; letter-spacing: 1px;
}
#action-btn:active { background: rgba(187,255,0,0.15); }
#orientation-gate { display: none; }
@media (orientation: portrait) and (max-width: 900px) {
  #orientation-gate {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 14px; line-height: 1.9;
    padding: 0 2rem; text-align: left;
  }
  #orientation-gate p { margin: 0; }
}
::selection { background: #333; color: var(--fg); }
</style>
</head>
<body>
<div id="bg-wrap">
  <div id="signal-pulse" aria-hidden="true"></div>
</div>
<main id="terminal" role="presentation">
  <div id="terminal-lines"></div>
</main>
<button id="action-btn" type="button"></button>
<div id="orientation-gate" aria-hidden="true">
  <p>&gt; portrait mode not supported.</p>
  <p>&gt; rotate device to continue.</p>
</div>
<script>
// ── JS↔ObjC bridge ──────────────────────────────────────────────
// ObjC calls window.injectorLog(msg, level) to push log lines.
// ObjC calls window.injectorReady() to show the action button.
// Button click calls window.injectorExecute() via ObjC bridge.

const linesEl = document.getElementById('terminal-lines');
const btnEl = document.getElementById('action-btn');
const pulseEl = document.getElementById('signal-pulse');

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function cap() {
  while (linesEl.children.length > 200) linesEl.removeChild(linesEl.firstChild);
}

function addLine(text, level) {
  const div = document.createElement('div');
  div.className = 'line' + (level ? ' ' + level : '');
  div.textContent = text;
  linesEl.appendChild(div);
  cap();
  // flash signal pulse
  if (pulseEl) {
    pulseEl.classList.remove('flash');
    pulseEl.offsetWidth;
    pulseEl.classList.add('flash');
  }
  // auto-scroll
  window.scrollTo(0, document.body.scrollHeight);
}

let cursorLine = null;
function showCursor(text) {
  if (cursorLine) {
    cursorLine.innerHTML = escapeHtml(text) + '<span class="cursor-underline"></span>';
  } else {
    cursorLine = document.createElement('div');
    cursorLine.className = 'line';
    cursorLine.innerHTML = escapeHtml(text) + '<span class="cursor-underline"></span>';
    linesEl.appendChild(cursorLine);
    cap();
  }
}

// ObjC bridge: ObjC evaluates JS like:
//   window.injectorLog('get r/w FD', 'ok')
window.injectorLog = function(msg, level) {
  if (cursorLine) { cursorLine = null; }
  addLine(msg, level || '');
};

// ObjC bridge: show action button with label
window.injectorShowButton = function(label) {
  btnEl.textContent = label;
  btnEl.style.display = 'block';
  // ASCII-art border via CSS pseudo is hard; use text decoration
  btnEl.setAttribute('data-ready', '1');
};

// ObjC bridge: hide button
window.injectorHideButton = function() {
  btnEl.style.display = 'none';
};

// Button click → notify ObjC
btnEl.addEventListener('click', function() {
  btnEl.style.display = 'none';
  // Send to ObjC via postMessage or URL scheme
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.injectorAction) {
    window.webkit.messageHandlers.injectorAction.postMessage('execute');
  } else {
    // Fallback: location trick
    window.location.href = 'injector://action/execute';
  }
});

// Initial cursor
showCursor('');
</script>
</body>
</html>
