name: Build DFMInjector

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          sudo bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Set up Theos environment
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Verify SDK
        run: |
          ls -la $THEOS/sdks/ || true
          xcrun --sdk iphoneos --show-sdk-path || true

      - name: Build
        run: |
          make clean || true
          make

      - name: Package IPA
        run: |
          mkdir -p packages
          APP_PATH=$(find .theos -name "DFMInjector.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r packages/DFMInjector.ipa Payload
          else
            echo "ERROR: DFMInjector.app not found"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DFMInjector
          path: packages/*.ipa
