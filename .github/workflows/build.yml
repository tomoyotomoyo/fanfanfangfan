name: Build DFMInjector

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos (git clone, no sudo installer)
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          brew install ldid

      - name: Set up Theos environment
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Show SDKs
        run: |
          xcodebuild -showsdks | grep -i iphoneos || true
          ls $THEOS/sdks 2>/dev/null || echo "(no theos sdks, will use Xcode SDK)"

      - name: Build
        run: |
          make clean || true
          make

      - name: Package IPA
        run: |
          mkdir -p packages
          APP_PATH=$(find .theos -name "DFMInjector.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r packages/DFMInjector.ipa Payload
          else
            echo "ERROR: DFMInjector.app not found"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DFMInjector
          path: packages/*.ipa
